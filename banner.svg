<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" fill="none" role="img" aria-labelledby="greeting">
  <title id="greeting">Hi, I'm Margot.</title>
  <style>
    .typing-window { animation: type-line 7s steps(15, end) infinite; }
    .typing-cursor { animation: move-cursor 7s steps(15, end) infinite, blink-cursor .9s step-end infinite; }
    @keyframes type-line { 0%, 6% { width: 0; } 46%, 88% { width: 378px; } 100% { width: 0; } }
    @keyframes move-cursor { 0%, 6% { transform: translateX(0); } 46%, 88% { transform: translateX(378px); } 100% { transform: translateX(0); } }
    @keyframes blink-cursor { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .typing-window { animation: none; width: 378px; } .typing-cursor { display: none; } }
  </style>
  <defs><clipPath id="typing-clip"><rect class="typing-window" x="42" y="54" width="378" height="58"/></clipPath></defs>
  <rect width="1200" height="160" rx="6" fill="#03152f"/>
