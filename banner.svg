  <text x="42" y="100" fill="#39b9ff" font-family="Consolas,monospace" font-size="45" font-weight="600" textLength="378" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-clip)">Hi, I'm Margot.</text>
  <rect class="typing-cursor" x="47" y="64" width="3" height="44" rx="1" fill="#e9c878"/>
  <path d="M971 30L981 67L1018 77L981 87L971 124L961 87L924 77L961 67Z" stroke="#e9c878" stroke-width="1.5"/>
  <path d="M1065 41v17m-8.5-8.5h17M880 100v9m-4.5-4.5h9" stroke="#e9c878"/>
  <circle cx="867" cy="41" r="2" fill="#39b9ff"/><circle cx="1117" cy="105" r="2" fill="#fff"/><circle cx="1039" cy="118" r="1.5" fill="#39b9ff"/>
